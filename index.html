  <script>
    // In dashboard routes, compulsory Day Mode only (remove 'dark')
    const path = window.location.pathname;
    const isDashboard = path.startsWith('/recruiter') || path.startsWith('/admin') || path.startsWith('/profile') || path === '/dashboard' || path === '/recruiter-jobs' || path === '/admin-dashboard';
    const storedTheme = localStorage.theme;
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (!isDashboard && (storedTheme === 'dark' || (storedTheme === 'system' && prefersDark))) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
