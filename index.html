  <!-- Cloudinary Upload Widget -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script>
    // In dashboard routes, compulsory Day Mode only (remove 'dark')
    const path = window.location.pathname;
    const isDashboard = path.startsWith('/recruiter') || path.startsWith('/admin') || path.startsWith('/profile') || path === '/dashboard' || path === '/recruiter-jobs' || path === '/admin-dashboard';
    const storedTheme = localStorage.theme;
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (!isDashboard && (storedTheme === 'dark' || (storedTheme === 'system' && prefersDark))) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body
  class="bg-background text-foreground font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">

</body>
